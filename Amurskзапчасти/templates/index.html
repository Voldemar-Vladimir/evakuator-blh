<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amurskзапчасти</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h1 class="mb-4">Amurskзапчасти — автозапчасти б/у и контракт</h1>

    <!-- Поиск -->
    <form method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="search" class="form-control" placeholder="Поиск запчасти..." value="${search}">
            <button class="btn btn-outline-secondary" type="submit">Найти</button>
        </div>
    </form>

    <!-- Каталог -->
    <div class="row">
        % for part in parts:
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <img src="${part.photo_url or 'https://via.placeholder.com/300x200?text=No+Photo'}" class="card-img-top" alt="${part.name}">
                <div class="card-body">
                    <h5 class="card-title">${part.name}</h5>
                    <p class="card-text">Цена: ${part.price} ₽</p>
                    <a href="/part/${part.id}" class="btn btn-primary">Узнать цену</a>
                </div>
            </div>
        </div>
        % endfor
    </div>

    <hr>
    <a href="/admin" class="btn btn-outline-secondary btn-sm">Админ-панель</a>
</div>
</body>
</html>
