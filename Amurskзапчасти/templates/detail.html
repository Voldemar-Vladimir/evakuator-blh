<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${part.name} | Amurskзапчасти</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <a href="/" class="btn btn-outline-secondary mb-3">← Назад</a>

    % if success:
    <div class="alert alert-success">Заявка отправлена! Мы свяжемся с вами.</div>
    % endif

    <div class="row">
        <div class="col-md-6">
            <img src="${part.photo_url or 'https://via.placeholder.com/600x400?text=No+Photo'}" class="img-fluid" alt="${part.name}">
        </div>
        <div class="col-md-6">
            <h1>${part.name}</h1>
            <p class="lead">Цена: ${part.price} ₽</p>
            % if part.description:
            <p>${part.description}</p>
            % endif

            <hr>
            <h4>Узнать цену</h4>
            <form method="post" action="/part/${part.id}/lead">
                <div class="mb-3">
                    <input type="text" name="name" class="form-control" placeholder="Ваше имя" required>
                </div>
                <div class="mb-3">
                    <input type="tel" name="phone" class="form-control" placeholder="Телефон" required>
                </div>
                <div class="mb-3">
                    <textarea name="message" class="form-control" rows="2" placeholder="Сообщение (необязательно)"></textarea>
                </div>
                <button type="submit" class="btn btn-success">Отправить заявку</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
